[project]
name = "py-earth"
version = "0.1.0"
description = "A Python implementation of Jerome Friedman's Multivariate Adaptive Regression Splines"
authors = ["Jason Rudy <jcrudy@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
license = "BSD-3-Clause"
license-file = "LICENSE.txt"

[dependencies]
python = ">=3.11"
numpy = ">=1.24"
scipy = ">=0.16"
scikit-learn = ">=0.16"

[feature.dev.dependencies]
cython = ">=0.29.0"
pytest = ">=7.0"
pytest-cov = ">=2.12"
ruff = ">=0.1.0"
mypy = ">=1.0"
build = ">=0.10"

[feature.docs.dependencies]
sphinx-gallery = ">=0.7"
sphinx = ">=7"

[feature.export.dependencies]
sympy = ">=1.0"

[feature.all-tests.dependencies]
pandas = ">=1.0"
statsmodels = ">=0.12"
patsy = ">=0.5"
sympy = ">=1.0"

[environments]
default = { features = ["dev"] }
docs = { features = ["dev", "docs"] }
export = { features = ["dev", "export"] }
all-tests = { features = ["dev", "all-tests"] }

[tasks]

# Build tasks
build-wheels = { cmd = "python -m build --wheel" }
build-sdist = { cmd = "python -m build --sdist" }
build-editable = { cmd = "pip install -e ." }
build-all = { cmd = "python -m build" }

# Test tasks
test = { cmd = "pytest tests/", depends-on = ["build-editable"] }
test-cov = { cmd = "pytest --cov=pyearth --cov-report=html --cov-report=term tests/", depends-on = ["build-editable"] }
test-verbose = { cmd = "pytest -vv tests/", depends-on = ["build-editable"] }

# Lint and format tasks
lint = { cmd = "ruff check src/ tests/" }
lint-fix = { cmd = "ruff check --fix src/ tests/" }
format = { cmd = "ruff format src/ tests/" }
format-check = { cmd = "ruff format --check src/ tests/" }
typecheck = { cmd = "mypy src/pyearth" }
check-all = { cmd = "pixi run lint && pixi run format-check && pixi run typecheck" }

# Conda build tasks
conda-build = { cmd = "rattler-build build conda-recipe" }

# Installation tasks
install = { cmd = "pip install ." }
install-dev = { cmd = "pip install -e '.[dev]'" }

# Documentation tasks
build-docs = { cmd = "cd doc && make html", depends-on = ["build-editable"] }

# Clean tasks
clean = { cmd = "rm -rf build dist *.egg-info src/**/*.so src/**/*.pyc **/__pycache__" }
clean-all = { cmd = "pixi run clean && rm -rf .pixi .pytest_cache .coverage coverage .mypy_cache" }
